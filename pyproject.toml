[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "again-cli"
version = "0.1.0"
description = "Retry a command with backoff, and nothing else."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alisher Muhammadaliyev", email = "viltrumlik@gmail.com" }]
keywords = ["retry", "backoff", "ci", "flaky", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Viltrumlik/again"
Issues = "https://github.com/Viltrumlik/again/issues"

[project.scripts]
again = "again:main"

[tool.setuptools]
py-modules = ["again"]
